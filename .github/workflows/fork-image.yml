# Fork-only. Builds the server image (fork/docker/Dockerfile).
#
#   tag vYYYY.M.N   -> ghcr.io/neeppy/seanime:YYYY.M.N and :latest, plus a
#                      GitHub Release. Dependabot on the homelab repo opens
#                      the deploy PR for each new version.
#   push to main    -> :edge only, which nothing deploys
#   pull request    -> build only, as a check
#
# Releases are cut with fork/scripts/release.sh (the upstream sync does this
# itself for its merges). Versions are the fork's own, calendar-based ones.

name: Fork image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/seanime
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=seanime
            org.opencontainers.image.description=Seanime server (neeppy fork), hwaccel build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fork/docker/Dockerfile
          target: hwaccel
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/; s/$/`/' <<< "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout turns the tag into a lightweight one; fetch it
          # again to read the annotation (the release note).
          fetch-tags: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          note=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,$d')
          upstream=$(sed -nE 's/^\s*Version\s*=\s*"([^"]+)".*/\1/p' internal/constants/constants.go | head -1)
          prev=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1 || true)
          # (CI clones hold only the fork's own tags, never upstream's.)
          generated=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} --jq .body)
          {
            echo "${note}"
            echo
            echo "Based on Seanime ${upstream}. Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/seanime:${TAG#v}\`"
            echo
            echo "${generated}"
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
