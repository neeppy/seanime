# Fork-only. Builds the server image (fork/docker/Dockerfile) and, on main,
# pushes it to ghcr.io/neeppy/seanime as <upstream version>-fork.<run number>
# (e.g. 3.10.4-fork.12) and :latest. Renovate on the homelab repo watches
# those tags and opens the deploy PR. Pull requests only build, to check.

name: Fork image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/seanime

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: version
        run: |
          version=$(sed -nE 's/^\s*Version\s*=\s*"([^"]+)".*/\1/p' internal/constants/constants.go | head -1)
          [[ -n "$version" ]] || { echo "::error::No Version in internal/constants/constants.go"; exit 1; }
          echo "tag=${version}-fork.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fork/docker/Dockerfile
          target: hwaccel
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Pushed \`${IMAGE}:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
