# Fork-only. When an upstream-sync/<tag> PR (the ai-resolved ones from
# fork-upstream-sync.yml) is merged, releases it as the next patch version,
# like the sync does for clean merges. The tag is pushed with SYNC_TOKEN so
# that it starts fork-image.yml (pushes made with GITHUB_TOKEN don't).

name: Release upstream merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'upstream-sync/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Tag the next patch release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            fork/scripts/release.sh patch "Merge upstream ${HEAD_REF#upstream-sync/}" | tee -a "$GITHUB_STEP_SUMMARY"
